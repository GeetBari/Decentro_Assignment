services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - expense_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  expense_data:
